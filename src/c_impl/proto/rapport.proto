syntax = "proto3";

package rapport;

import "google/protobuf/empty.proto";

message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message GazeSample {
  int32 person_id = 1;
  Vector3 origin = 2;
  Vector3 direction = 3;
}

message InteractionEdge {
  int32 from_person_id = 1;
  int32 to_person_id = 2;
  float angle_deg = 3;
  bool is_looking = 4;
}

message PipelineUpdate {
  uint64 frame_index = 1;
  uint64 playback_timestamp_ns = 2;
  repeated GazeSample gazes = 3;
  repeated InteractionEdge interactions = 4;

  reserved 100 to 199;
}

service RapportStream {
  rpc StreamPipelineUpdates(google.protobuf.Empty) returns (stream PipelineUpdate);
}
